<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#067096" />

    <!-- Structural / global tags only. Per-route title, description, canonical,
         hreflang, Open Graph, and Twitter tags are managed by react-helmet-async
         via <SEO> in each page component. Keeping duplicates out of this file
         prevents browsers/crawlers from seeing the wrong (stale) canonical. -->

    <link rel="icon" href="/logo.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Font preconnect — ~200ms LCP improvement on cold loads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Title and description per route come from <Helmet> via the <SEO> component.
         Keeping them out of this template prevents duplicates in the generated HTML. -->

    <!-- Global robots + geo — fine to repeat across all pages -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <meta name="geo.region" content="KW" />
    <meta name="geo.placename" content="Kuwait City" />
    <meta name="geo.position" content="29.3759;47.9774" />
    <meta name="ICBM" content="29.3759, 47.9774" />

    <!-- Sitemap pointer -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Organization-level structured data (applies site-wide).
         Route-level structured data (if needed) goes through the SEO component. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GeneralContractor",
      "@id": "https://tadeemco.com/#organization",
      "name": "Tadeemco",
      "alternateName": "شركة تدعيمكو",
      "description": "Kuwaiti specialist in groundwater dewatering, shoring, waterproofing, and excavation works. Serving main contractors and consulting offices across the State of Kuwait.",
      "url": "https://tadeemco.com",
      "logo": "https://tadeemco.com/logo.jpg",
      "image": "https://tadeemco.com/og-image.jpg",
      "email": "info@tadeemco.com",
      "telephone": ["+96590001662", "+96592223657", "+96599667785", "+96590888809"],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Darwaza Building 51, Floor 6, Office 30",
        "addressLocality": "Kuwait City",
        "addressCountry": "KW"
      },
      "areaServed": { "@type": "Country", "name": "Kuwait" },
      "sameAs": ["https://instagram.com/tadeemco"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Construction Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Groundwater Dewatering", "alternateName": "نزح المياه الجوفية" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Shoring Works", "alternateName": "أعمال التدعيم" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Waterproofing", "alternateName": "العازل المائي" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Excavation Works", "alternateName": "أعمال الحفر" } }
        ]
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
